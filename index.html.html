<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Your Details</title>
<style>
  :root {
    --ink: #1b1b1b;
    --paper: #faf9f6;
    --line: #d8d4cb;
    --accent: #2f5d50;
    --accent-ink: #ffffff;
    --error: #a3342a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 40px 36px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 6px;
    font-weight: 600;
  }
  .subtitle {
    font-family: Arial, sans-serif;
    font-size: 0.92rem;
    color: #5a5650;
    margin: 0 0 30px;
    line-height: 1.4;
  }
  label {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .field { margin-bottom: 22px; }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px 12px;
    font-family: Arial, sans-serif;
    font-size: 0.95rem;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    font-family: Arial, sans-serif;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 12px 26px;
    font-size: 0.95rem;
    border-radius: 3px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .status {
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    margin-top: 16px;
  }
  .status.error { color: var(--error); }
  .status.success { color: var(--accent); }
  .required { color: var(--error); }
</style>
</head>
<body>
  <div class="card">
    <h1>Add Your Details</h1>
    <p class="subtitle">Enter your name and address below. It will be added directly to a shared list.</p>

    <form id="responseForm">
      <div class="field">
        <label for="name">Name <span class="required">*</span></label>
        <input type="text" id="name" name="Name" required>
      </div>

      <div class="field">
        <label for="address">Address <span class="required">*</span></label>
        <textarea id="address" name="Address" required></textarea>
      </div>

      <button type="submit" id="submitBtn">Add me to the list</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    // Paste the Web App URL from your Apps Script deployment here
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySkDSTDWJywo_Orz8tdsi0QIJMFxcXuv9AfqxP5FbaTBMYEMBs9yHmG9Kf5kWFv8aE/exec";

    const form = document.getElementById('responseForm');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      status.textContent = '';
      status.className = 'status';

      if (SCRIPT_URL.includes("PASTE_YOUR_WEB_APP_URL_HERE")) {
        status.textContent = 'Set SCRIPT_URL in the HTML file first (see instructions.md).';
        status.className = 'status error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Adding...';

      const formData = new FormData(form);

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData
      })
        .then(res => res.json())
        .then(data => {
          if (data.result === 'success') {
            status.textContent = 'Added — thank you!';
            status.className = 'status success';
            form.reset();
          } else {
            throw new Error(data.error || 'Unknown error');
          }
        })
        .catch(err => {
          status.textContent = 'Something went wrong: ' + err.message;
          status.className = 'status error';
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Add me to the list';
        });
    });
  </script>
</body>
</html>
